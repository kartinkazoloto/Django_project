{% extends 'base.html' %}

{% block title %}Food Box - {{ object.name }}{% endblock %}

{% block content %}
{% load my_tags %}
    <div class="col">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ object.name }}</h4>
            </div>
            <img src="{{ product.image|media_filter }}" alt="{{ product.name }}" width="150px" height="150px">
            <div class="card-body">
                <h3 class="card-title pricing-card-title">{{ object.price }} руб.</h3>
                <p class="card-text">{{ object.description }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-outline-secondary">Купить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
