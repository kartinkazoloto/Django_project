{% extends 'base.html' %}

{% block title %}Food Box - {{ object.name }}{% endblock %}

{% block content %}
{% load my_tags %}
    <div class="col">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ object.name }}</h4>
            </div>
            <img src="{{ object.image|media_filter }}" alt="{{ object.name }}" width="150px" height="150px">
            <div class="card-body">
                <h3 class="card-title pricing-card-title">{{ object.price }} руб.</h3>
                <p class="card-text">{{ object.description }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-outline-secondary">Купить</button>
                        <a href="{% url 'catalog:product_list' %}" class="btn btn-sm btn-outline-secondary">Назад к каталогу</a>
                    </div>
                    <div class="btn-group">
                        <a href="{% url 'catalog:product_edit' object.pk %}" class="btn btn-sm btn-outline-secondary">Редактировать</a>
                        <a href="{% url 'catalog:product_delete' object.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
