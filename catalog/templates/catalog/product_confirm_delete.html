{% extends 'base.html' %}

{% block title %}Food Box - Удаление товара{% endblock %}

{% block content %}
<div class="col">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="my-0 font-weight-normal">Подтверждение удаления</h4>
        </div>
        <div class="card-body">
            <div class="alert alert-warning">
                <h5>Вы уверены, что хотите удалить товар "{{ product.name }}"?</h5>
                <p class="text-muted">Это действие нельзя будет отменить.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-sm btn-outline-secondary">
                        ← Назад к товару
                    </a>
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Да, удалить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
