{% extends 'base.html' %}

{% block title %}Blog - {% if object %}Редактирование записи{% else %}Создание записи{% endif %}{% endblock %}

{% block content %}

    <h1>{% if object %}Редактирование записи{% else %}Создание записи{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
{% endblock %}
