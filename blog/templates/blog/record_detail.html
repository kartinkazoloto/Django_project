<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Record Detail</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
  <h1>{{ record.name }}</h1>
  {% if record.image %}
      <img src="{{ record.image.url }}" alt="{{ record.name }}" style="max-width: 300px;">
  {% endif %}
  <p>{{ record.content }}</p>
  <p>Опубликовано: {{ record.created_at }}</p>
  <a href="{% url 'blog:record_edit' record.pk %}">Редактировать</a>
  <a href="{% url 'blog:record_delete' record.pk %}">Удалить</a>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
