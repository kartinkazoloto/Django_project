{% extends 'base.html' %}

{% block title %}Blog - детали записи{% endblock %}

{% block content %}

  <h1>{{ record.name }}</h1>
  {% if record.image %}
      <img src="{{ record.image.url }}" alt="{{ record.name }}" style="max-width: 300px;">
  {% endif %}
  <p>{{ record.description }}</p>
  <p>Опубликовано: {{ record.created_at }}</p>
        <a href="{% url 'blog:record_edit' record.pk %}" class="btn btn-sm btn-outline-secondary">Редактирование</a>
        <a href="{% url 'blog:record_delete' record.pk %}" class="btn btn-sm btn-outline-secondary">Удаление</a>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-sm btn-outline-secondary">Назад к списку записей</a>
<script src="/static/js/bootstrap.bundle.min.js"></script>

{% endblock %}
