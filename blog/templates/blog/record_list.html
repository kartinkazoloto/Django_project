{% extends 'base.html' %}

{% block title %}Blog - Список записей{% endblock %}

{% block content %}
{% load my_tags %}
{% for record in object_list %}
    <div class="col">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ record.name }}</h4>
            </div>
            <img src="{{ product.image|media_filter }}" alt="{{ record.name }}" width="150px" height="150px">
            <div class="card-body">
                <p class="card-text">{{ record.description }}</p>
                Просмотров: {{ record.number_of_views }}
                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                        <a href="{% url 'blog:record_detail' record.pk %}" class="btn btn-sm btn-outline-secondary">Просмотр</a>
                        <a href="{% url 'blog:record_edit' record.pk %}" class="btn btn-sm btn-outline-secondary">Редактирование</a>
                        <a href="{% url 'blog:record_delete' record.pk %}" class="btn btn-sm btn-outline-secondary">Удаление</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
{% endblock %}
